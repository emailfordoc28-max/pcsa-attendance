services:
  - type: web
    name: pcsa-attendance-site
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
